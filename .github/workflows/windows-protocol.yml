name: Windows Codex compatibility
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codex:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Codex only
        run: npm install --prefix work/ci-codex --no-save --ignore-scripts @openai/codex@0.165.0
      - name: Expose dependency to protocol test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node_modules/@openai | Out-Null
          Copy-Item -Recurse work/ci-codex/node_modules/@openai/* node_modules/@openai/
      - name: Start real Windows Codex thread with reading permissions
        run: node scripts/check-codex-protocol.mjs
      - name: Verify retry diagnosis and single-task behavior
        run: |
          node scripts/check-transport.mjs
          node scripts/check-companion.mjs
      - name: Verify updater integrity and launch gating
        run: node scripts/check-updater.mjs
  paper-layouts:
    name: Check paper layouts and paragraph boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the production PDF extractor
        run: |
          npm install --prefix work/layout-tools --no-save --no-audit --no-fund pdfjs-dist@5.7.284
          mkdir -p node_modules
          ln -s ../work/layout-tools/node_modules/pdfjs-dist node_modules/pdfjs-dist
      - name: Check generated layouts and public research PDFs
        run: |
          node scripts/check-argument-paragraphs.mjs
          node scripts/check-paper-layouts.mjs
