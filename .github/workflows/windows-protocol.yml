name: Windows Codex compatibility
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codex:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Codex only
        run: npm install --prefix work/ci-codex --no-save --ignore-scripts @openai/codex@0.165.0
      - name: Expose dependency to protocol test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force node_modules/@openai | Out-Null
          Copy-Item -Recurse work/ci-codex/node_modules/@openai/* node_modules/@openai/
      - name: Start real Windows Codex thread with reading permissions
        run: node scripts/check-codex-protocol.mjs
      - name: Verify updater integrity and launch gating
        run: node scripts/check-updater.mjs
