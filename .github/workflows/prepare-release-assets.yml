name: Stage verified installers on a draft
on:
  workflow_dispatch:
    inputs:
      mac_run_id:
        description: Successful native macOS build
        required: true
  push:
    branches: ['release/desktop-v*']
permissions:
  contents: write
  actions: read
concurrency:
  group: desktop-publication
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_MAC_RUN: ${{ inputs.mac_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Select and verify the source for each native artifact
        id: builds
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./desktop/package.json").version')
          tag="v$version"
          test "$version" = "$(node -p 'require("./desktop/release.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "release/desktop-$tag"
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main
            test -s "docs/releases/$tag.md"
          else
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          mac=${REQUESTED_MAC_RUN:-$(node -p 'require("./desktop/release.json").buildRuns.macos')}
          win=$(node -p 'require("./desktop/release.json").buildRuns?.windows || ""')
          for platform in mac windows; do
            if [[ "$platform" == mac ]]; then
              run="$mac"; workflow=macos-release; inputs=(scripts/build-macos.mjs scripts/check-macos.mjs)
            else
              run="$win"; workflow=windows-build; inputs=(scripts/build-desktop.mjs scripts/build-installer.mjs scripts/check-desktop.mjs)
              if [[ -z "$run" && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then continue; fi
            fi
            [[ "$run" =~ ^[0-9]+$ ]]
            info=$(gh api "repos/$GH_REPO/actions/runs/$run")
            test "$(jq -r .conclusion <<< "$info")" = success
            test "$(jq -r .path <<< "$info")" = ".github/workflows/$workflow.yml"
            source_sha=$(jq -r .head_sha <<< "$info")
            git diff --exit-code "$source_sha" HEAD -- desktop companion "${inputs[@]}" ':(exclude)desktop/release.json'
          done
          echo "mac=$mac" >> "$GITHUB_OUTPUT"
          echo "windows=$win" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.builds.outputs.mac }}
          pattern: Paperleaf-macOS-*
          path: installers
          merge-multiple: false
      - uses: actions/download-artifact@v4
        if: steps.builds.outputs.windows != ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.builds.outputs.windows }}
          name: Paperleaf-Windows-x64
          path: work/installer
      - name: Verify complete installers and stage the release
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          exe="work/installer/Paperleaf-Setup-$version-Windows-x64.exe"
          if [[ ! -s "$exe" ]]; then
            if gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "$exe")"; then
              mkdir -p work/installer
              gh release download "$RELEASE_TAG" --pattern "$(basename "$exe")" --dir work/installer
            else
              node scripts/fetch-release-installer.mjs
            fi
          fi
          echo "$(node -p 'require("./desktop/release.json").sha256')  $exe" | sha256sum -c -
          files=("$exe")
          for arch in arm64 x64; do
            dir="installers/Paperleaf-macOS-$arch"
            base="Paperleaf-$version-macOS-$arch"
            (cd "$dir" && sha256sum -c "$base.dmg.sha256" && sha256sum -c "$base.pkg.sha256")
            pkg="$dir/$base.pkg"
            echo "$(node -p 'require("./desktop/release.json").macPackages[process.argv[1]].sha256' "$arch")  $pkg" | sha256sum -c -
            test "$(stat -c %s "$pkg")" = "$(node -p 'require("./desktop/release.json").macPackages[process.argv[1]].size' "$arch")"
            files+=("$dir/$base.dmg" "$dir/$base.dmg.sha256" "$pkg" "$dir/$base.pkg.sha256")
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$GITHUB_EVENT_NAME" = push
            title=$(sed -n '1s/^# //p' "docs/releases/$RELEASE_TAG.md")
            test -n "$title"
            tail -n +2 "docs/releases/$RELEASE_TAG.md" > work/release-notes.md
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "$title" --notes-file work/release-notes.md
          fi
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            if ! grep -Fxq "$(basename "$file")" <<< "$existing"; then gh release upload "$RELEASE_TAG" "$file"; fi
          done
          gh release view "$RELEASE_TAG" --json assets > work/attached.json
          node scripts/check-release-assets.mjs work/attached.json "${files[@]}"
      - name: Publish verified assets for the requested release branch
        if: github.event_name == 'push'
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release edit "$RELEASE_TAG" --draft=false --latest
          gh release view "$RELEASE_TAG" --json url,isDraft --jq '{url,isDraft}'
